name: CI

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  LIBVIPS_VERSION: 8.18.6

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up libvips
        uses: ./.github/actions/setup-libvips
        with:
          libvips-version: ${{ env.LIBVIPS_VERSION }}

      - name: Verify formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: Verify modules are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Run tests
        run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up libvips
        uses: ./.github/actions/setup-libvips
        with:
          libvips-version: ${{ env.LIBVIPS_VERSION }}

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: ./...
