[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vylux-manual"
version = "0.1.0"
description = "Local-only manual testing helpers for a Vylux instance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
rustfs = ["boto3>=1.34"]

[project.scripts]
vylux-manual = "vylux_manual.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
